name: Browser identity
on:
  push:
    branches: [feat/distinct-intelligence-crm-favicons]
permissions:
  contents: write
jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/distinct-intelligence-crm-favicons
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add dynamic browser identity
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          marker = 'document.title = crmMode ? "VIMALUX CRM" : "VIMALUX Intelligence";'
          if marker not in s:
              anchor = '  const t = useT(project.language);\n  const result = useMemo(() => calculateBusinessCase(applyWarrantyPricing(project)), [project]);'
              replacement = '''  const t = useT(project.language);\n  useEffect(() => {\n    const crmMode = view === "crm";\n    document.title = crmMode ? "VIMALUX CRM" : "VIMALUX Intelligence";\n    const favicon = document.querySelector('link[rel="icon"]');\n    if (favicon) {\n      favicon.setAttribute("href", crmMode ? "/favicon-crm.svg" : "/favicon-intelligence.svg");\n      favicon.setAttribute("type", "image/svg+xml");\n    }\n  }, [view]);\n  const result = useMemo(() => calculateBusinessCase(applyWarrantyPricing(project)), [project]);'''
              if anchor not in s:
                  raise SystemExit('App.jsx insertion anchor not found')
              p.write_text(s.replace(anchor, replacement, 1))

          t = Path('test/browserIdentity.test.js')
          t.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport fs from "node:fs";\n\ntest("CRM and Intelligence expose distinct browser identities", () => {\n  const app = fs.readFileSync(new URL("../src/App.jsx", import.meta.url), "utf8");\n  const html = fs.readFileSync(new URL("../index.html", import.meta.url), "utf8");\n  assert.match(app, /VIMALUX CRM/);\n  assert.match(app, /favicon-crm\\.svg/);\n  assert.match(app, /favicon-intelligence\\.svg/);\n  assert.match(html, /favicon-intelligence\\.svg/);\n});\n''')
          PY
      - name: Verify files
        run: |
          test -f public/favicon-intelligence.svg
          test -f public/favicon-crm.svg
          grep -q 'VIMALUX CRM' src/App.jsx
          grep -q 'favicon-intelligence.svg' index.html
      - run: npm test
      - run: npm run build
      - name: Commit validated dynamic identity
        run: |
          git config user.name VIMALUX
          git config user.email 99176508+Vimalux@users.noreply.github.com
          git add src/App.jsx test/browserIdentity.test.js
          git diff --cached --quiet || git commit -m "Switch browser identity between Intelligence and CRM"
          git push origin HEAD:feat/distinct-intelligence-crm-favicons
