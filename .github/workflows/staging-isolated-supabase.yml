name: Staging isolated Supabase runtime
on:
  push:
    branches:
      - staging/felicity-procurement-safe-release
    paths:
      - '.github/staging-isolated-supabase.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/felicity-procurement-safe-release
      - name: Patch App for isolated preview runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('src/App.jsx')
          s = app.read_text()

          s = s.replace(
            '  saveCloudState,\n  supabase,\n  supabaseConfigured,\n',
            '  saveCloudState,\n  loadStagingCatalogue,\n  stagingPreview,\n  supabase,\n  supabaseConfigured,\n',
            1,
          )
          s = s.replace(
            '  const [currentProfile, setCurrentProfile] = useState(null);\n  const [authReady, setAuthReady] = useState(!supabaseConfigured);\n  const [cloudReady, setCloudReady] = useState(!supabaseConfigured);\n',
            '  const [currentProfile, setCurrentProfile] = useState(stagingPreview ? { id: "staging-preview", role: "admin", email: "staging@vimalux.local", full_name: "Staging Preview" } : null);\n  const [authReady, setAuthReady] = useState(stagingPreview || !supabaseConfigured);\n  const [cloudReady, setCloudReady] = useState(stagingPreview || !supabaseConfigured);\n',
            1,
          )
          s = s.replace(
            '    ready: !supabaseConfigured || Boolean(session && cloudReady && roleVerified),\n',
            '    ready: stagingPreview || !supabaseConfigured || Boolean(session && cloudReady && roleVerified),\n',
            1,
          )
          s = s.replace(
            '    if (!supabaseConfigured) return;\n    supabase.auth.getSession()',
            '    if (!supabaseConfigured || stagingPreview) return;\n    supabase.auth.getSession()',
            1,
          )
          s = s.replace(
            '    if (!supabaseConfigured || !session) return;\n    let active = true;\n    setSyncState("loading");\n',
            '    if (!supabaseConfigured || stagingPreview || !session) return;\n    let active = true;\n    setSyncState("loading");\n',
            1,
          )
          s = s.replace(
            '    if (!supabaseConfigured || !session || !cloudReady) return;\n    setSyncState("saving");\n',
            '    if (!supabaseConfigured || stagingPreview || !session || !cloudReady) return;\n    setSyncState("saving");\n',
            1,
          )

          marker = '  useEffect(() => {\n    if (isAgent && !isAgentViewAllowed(view, agentAllowedViews)) setView("customer");\n  }, [isAgent, view]);\n'
          staging_effect = marker + '''  useEffect(() => {\n    if (!stagingPreview) return;\n    let active = true;\n    setSyncState("loading");\n    loadStagingCatalogue()\n      .then((catalogue) => {\n        if (!active || !catalogue) return;\n        setProjects((current) => current.map((item) => migrateProject({ ...item, catalogue })));\n        setCurrentProfile({ id: "staging-preview", role: "admin", email: "staging@vimalux.local", full_name: "Staging Preview" });\n        setCloudReady(true);\n        setSyncState("local");\n        setSyncError("");\n      })\n      .catch((error) => {\n        if (!active) return;\n        setSyncError(`Staging catalogue: ${error.message}`);\n        setSyncState("error");\n      });\n    return () => { active = false; };\n  }, []);\n'''
          if 'Staging catalogue:' not in s:
              if marker not in s:
                  raise SystemExit('staging effect anchor missing')
              s = s.replace(marker, staging_effect, 1)

          s = s.replace(
            '  if (supabaseConfigured && !session) return <AuthScreen />;\n',
            '  if (supabaseConfigured && !stagingPreview && !session) return <AuthScreen />;\n',
            1,
          )
          s = s.replace(
            '        {supabaseConfigured && <button className="signout" onClick={() => supabase.auth.signOut()}>Esci / Sign out</button>}\n',
            '        {supabaseConfigured && !stagingPreview && <button className="signout" onClick={() => supabase.auth.signOut()}>Esci / Sign out</button>}\n',
            1,
          )

          app.write_text(s)
          PY
      - name: Fix partner equipment selector UX
        run: node scripts/fix-partner-equipment-selector.cjs
      - name: Run full regression suite
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit isolated staging runtime
        run: |
          git config user.name "VIMALUX Automation"
          git config user.email "99176508+Vimalux@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet || git commit -m "Use isolated Supabase catalogue and fixed partner selector in preview runtime"
          git push origin HEAD:staging/felicity-procurement-safe-release
