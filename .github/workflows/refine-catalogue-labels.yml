name: Refine catalogue capability labels
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-catalogue-labels.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refine Intelligence catalogue labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/CatalogueExtended.jsx')
          s = p.read_text()
          s = s.replace('<label className="catalogue-checkbox"><span>Zhaga</span>', '<label className="catalogue-checkbox"><span>{it ? "Compatibile Zhaga" : "Zhaga capable"}</span>')
          s = s.replace('<label className="catalogue-checkbox"><span>D4i Driver</span>', '<label className="catalogue-checkbox"><span>{it ? "Compatibile D4i" : "D4i capable"}</span>')
          s = s.replace('<label className="catalogue-url"><span>Photometry URL</span>', '<label className="catalogue-url"><span>{it ? "Riferimento fotometria / Planner" : "Photometry / Planner reference"}</span>')
          old_it = 'Struttura comune Intelligence + Planner. Categoria, compatibilità e strategia determinano quali prodotti possono essere assegnati a una lampada esistente.'
          new_it = 'Master catalogo Intelligence. Categoria, compatibilità, strategia, prestazioni, prezzi e capability Smart vengono usati nel Business Case; CCT, ottiche, interfaccia, colore e codice variante definitivo vengono configurati in Planner.'
          old_en = 'Shared Intelligence + Planner structure. Category, compatibility and strategy determine which products can be assigned to an existing luminaire.'
          new_en = 'Intelligence master catalogue. Category, compatibility, strategy, performance, pricing and Smart capabilities are used in the Business Case; exact CCT, optics, interface, colour and final variant code are configured in Planner.'
          s = s.replace(old_it, new_it).replace(old_en, new_en)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "VIMALUX Automation"
          git config user.email "99176508+Vimalux@users.noreply.github.com"
          git add src/CatalogueExtended.jsx
          git diff --cached --quiet || git commit -m "Clarify Intelligence catalogue capabilities vs Planner variants"
          git push origin HEAD:main
