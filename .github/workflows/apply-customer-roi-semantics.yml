name: Apply customer ROI semantics patch

on:
  push:
    branches:
      - staging/customer-roi-semantics-safe-release-20260928
    paths:
      - .github/customer-roi-semantics.trigger

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/customer-roi-semantics-safe-release-20260928
          fetch-depth: 0
      - name: Apply source patch
        run: python .github/scripts/apply_customer_roi_semantics.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/calculationsBase.js src/report.js test/customerFinancialSemantics.test.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "SAFE STAGING: clarify customer ROI and payback semantics"
          git push origin HEAD:staging/customer-roi-semantics-safe-release-20260928
