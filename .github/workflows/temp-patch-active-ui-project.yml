name: TEMP apply active UI project patch
on:
  push:
    branches:
      - staging/new-project-context-identity-safe-release-20260928
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[active-ui-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/new-project-context-identity-safe-release-20260928
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/patch-active-ui-project.cjs
      - run: |
          git config user.name "VIMALUX"
          git config user.email "99176508+Vimalux@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SAFE STAGING: persist active UI project across reload [active-ui-patched]"
          git push origin HEAD:staging/new-project-context-identity-safe-release-20260928
