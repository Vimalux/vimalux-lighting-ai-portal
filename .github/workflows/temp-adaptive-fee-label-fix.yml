name: TEMP Adaptive fee label fix

on:
  push:
    branches:
      - staging/customer-roi-semantics-safe-release-20260928
    paths:
      - .github/workflows/temp-adaptive-fee-label-fix.yml

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/customer-roi-semantics-safe-release-20260928
          fetch-depth: 0
      - name: Apply exact source edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.jsx')
          text = app.read_text()
          anchor = '  const customerInitialInvestment = cashDeal ? r.totalCapex : Number(p.assumptions.upfrontPayment || 0);\n  const paymentKpis ='
          replacement = '''  const customerInitialInvestment = cashDeal ? r.totalCapex : Number(p.assumptions.upfrontPayment || 0);\n  const adaptiveDimmingFeeLabel = allInclusive\n    ? (it ? "Adaptive Dimming service fee annua (inclusa nel canone)" : "Annual Adaptive Dimming service fee (included in payment)")\n    : r.dealType === "finance"\n      ? (it ? "Adaptive Dimming service fee annua (inclusa nell'OPEX servizi)" : "Annual Adaptive Dimming service fee (included in service OPEX)")\n      : (it ? "Adaptive Dimming service fee annua" : "Annual Adaptive Dimming service fee");\n  const paymentKpis ='''
          if anchor not in text:
              raise SystemExit('App anchor not found')
          text = text.replace(anchor, replacement, 1)

          old = '...(r.powerAidEnabled ? [[it ? "Adaptive Dimming service fee annua" : "Annual Adaptive Dimming service fee", money2(r.powerAidCustomerFee)], [it ? "Beneficio netto cliente Adaptive Dimming"'
          new = '...(r.powerAidEnabled ? [[adaptiveDimmingFeeLabel, money2(r.powerAidCustomerFee)], [it ? "Beneficio netto cliente Adaptive Dimming"'
          if old not in text:
              raise SystemExit('Adaptive Dimming KPI anchor not found')
          text = text.replace(old, new, 1)
          app.write_text(text)

          test = Path('test/customerFinancialSemantics.test.js')
          t = test.read_text()
          test_anchor = '  assert.match(source, /Metriche tecniche del progetto/);\n'
          test_replacement = test_anchor + '  assert.match(source, /Adaptive Dimming service fee annua \\(inclusa nel canone\\)/);\n  assert.match(source, /Adaptive Dimming service fee annua \\(inclusa nell\\\'OPEX servizi\\)/);\n'
          if test_anchor not in t:
              raise SystemExit('Test anchor not found')
          t = t.replace(test_anchor, test_replacement, 1)
          test.write_text(t)
          PY
      - name: Commit source-only fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "VIMALUX"
          git config user.email "99176508+Vimalux@users.noreply.github.com"
          git rm .github/workflows/temp-adaptive-fee-label-fix.yml
          git add src/App.jsx test/customerFinancialSemantics.test.js
          git commit -m "SAFE STAGING: clarify Adaptive Dimming fee inclusion labels"
          git push origin HEAD:staging/customer-roi-semantics-safe-release-20260928
