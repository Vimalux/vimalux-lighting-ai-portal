name: Upgrade customer economics and CMS partners
on:
  push:
    branches: [main]
    paths: ['.github/workflows/upgrade-customer-economics-cms-partners.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate Intelligence
        run: |
          node scripts/upgrade-customer-economics-cms-partners.cjs
          if npm run build > build-debug.log 2>&1; then
            echo OK > build-status.txt
          else
            echo FAILED > build-status.txt
            git restore src/App.jsx src/partners.js
          fi
      - name: Commit result or diagnostics
        run: |
          git config user.name "VIMALUX Automation"
          git config user.email "99176508+Vimalux@users.noreply.github.com"
          if grep -q OK build-status.txt; then
            rm -f build-debug.log build-status.txt
            git add -A src/App.jsx src/partners.js build-debug.log build-status.txt
            git diff --cached --quiet || git commit -m "Simplify customer economics and generalize CMS partner pipeline"
          else
            git add build-debug.log build-status.txt
            git commit -m "Capture Intelligence upgrade build error"
          fi
          git push origin HEAD:main
