name: Upgrade customer economics and CMS partners
on:
  push:
    branches: [main]
    paths: ['.github/workflows/upgrade-customer-economics-cms-partners.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Intelligence UI and partner model
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('src/App.jsx')
          s = app.read_text()

          s = s.replace(
            '!isAgent && <button className={view === "datek" ? "active" : ""} onClick={() => setView("datek")}>DATEK</button>',
            '!isAgent && <button className={view === "datek" ? "active" : ""} onClick={() => setView("datek")}>CMS Partners</button>'
          )
          s = s.replace(
            '!isAgent && view === "datek" && <DatekDashboard projects={syncedProjects} money={money} />',
            '!isAgent && view === "datek" && <CmsPartnerDashboard projects={syncedProjects} money={money} />'
          )

          customer_summary = r'''function CustomerSummary({ p, r, money }) { const it = p.language === "it"; const first = r.customerValueRows?.[0]; const currentMonthly = (first?.currentOperatingCost || 0) / 12; const monthlySaving = (first?.customerSaving || r.customerAnnualNetBenefit || 0) / 12; const newMonthly = Math.max(0,currentMonthly-monthlySaving); const upfront = r.dealType === "cash" ? r.totalCapex : Number(p.assumptions.upfrontPayment || 0); const customerPayment = r.monthlyPayment || 0; const positiveFromStart = r.dealType !== "cash" && monthlySaving >= 0; const paymentLabel = r.dealType === "noleggio_operativo" ? (it ? "Canone mensile tutto incluso" : "All-inclusive monthly payment") : r.dealType === "finance" ? (it ? "Pagamento mensile totale" : "Total monthly payment") : (it ? "Pagamento mensile" : "Monthly payment"); return <><Card className="customer-summary-card" title={it ? "Sintesi economica cliente" : "Customer economics summary"}><div className="kpis customer-summary-kpis"><Kpi label={it ? "Investimento iniziale" : "Upfront investment"} value={money(upfront)} /><Kpi label={it ? "Costo operativo attuale / mese" : "Current operating cost / month"} value={money(currentMonthly)} /><Kpi label={paymentLabel} value={money(customerPayment)} /><Kpi label={it ? "Nuovo costo totale / mese" : "New total cost / month"} value={money(newMonthly)} /><Kpi label={it ? "Risparmio netto / mese" : "Net saving / month"} value={money(monthlySaving)} /><Kpi label={it ? "Cash flow positivo dal primo mese" : "Positive cash flow from month one"} value={positiveFromStart ? (it ? "Sì" : "Yes") : (it ? "No" : "No")} /></div><p className="hint">{r.dealType === "noleggio_operativo" ? (it ? "Il canone comprende il servizio previsto dal contratto. Nessun CAPEX iniziale salvo eventuale anticipo configurato." : "The payment includes the contracted service. No upfront CAPEX unless a configured advance payment applies.") : r.dealType === "finance" ? (it ? "La rata di finanziamento e l'OPEX restano separati nel modello interno; qui è mostrato il costo totale per il cliente." : "Financing and OPEX remain separate in the internal model; this view shows the customer's total cost.") : (it ? "Scenario acquisto diretto: il CAPEX iniziale è sostenuto dal cliente." : "Direct-purchase scenario: the customer funds the upfront CAPEX.")}</p></Card></>; }
'''
          marker = 'function Kpis({ p, r, t, money, num })'
          if 'function CustomerSummary(' not in s:
            if marker not in s: raise SystemExit('Kpis marker not found')
            s = s.replace(marker, customer_summary + marker)

          # Customer-facing pages get the simple summary. Detailed economics remain below / internal.
          s = s.replace('<Kpis p={p} r={r} t={t} money={money} num={num} />','<CustomerSummary p={p} r={r} money={money} />')
          s = s.replace(
            '<h3>{p.language === "it" ? "Flusso di cassa cliente" : "Customer cash flow"}</h3><CashTable p={p} r={r} money={money} />',
            '<details className="advanced-customer-economics"><summary>{p.language === "it" ? "Dettaglio economico annuale" : "Annual economics detail"}</summary><h3>{p.language === "it" ? "Flusso di cassa cliente" : "Customer cash flow"}</h3><CashTable p={p} r={r} money={money} /></details>'
          )

          dashboard = r'''function CmsPartnerDashboard({ projects, money }) { const detectedPartners = [...new Set(projects.map((project) => { const product = (project.catalogue?.smart || []).find((item) => item.id === project.solution?.lcuProductId); return String(product?.brand || "").trim(); }).filter(Boolean))].sort(); const [partner,setPartner] = useState(detectedPartners.includes("DATEK") ? "DATEK" : detectedPartners[0] || "DATEK"); const totals = partnerTotals(projects,partner); const forecast = growthForecast(totals.arr); return <><Card title="CMS Partner"><div className="form-grid"><Field label="CMS Partner" value={partner} onChange={setPartner}>{detectedPartners.map((name) => <option key={name} value={name}>{name}</option>)}</Field></div></Card><div className="kpis"><Kpi label="Municipalities" value={totals.municipalities} /><Kpi label="Projects" value={totals.projects} /><Kpi label="Luminaires" value={totals.luminaires} /><Kpi label="LCUs" value={totals.lcus} /><Kpi label="Annual CMS revenue" value={money(totals.annualRevenue)} /><Kpi label="MRR" value={money(totals.mrr)} /><Kpi label="ARR" value={money(totals.arr)} /><Kpi label="Total CMS contract value" value={money(totals.totalContractValue)} /><Kpi label="Pipeline TCV" value={money(totals.pipelineTcv)} /><Kpi label="Weighted TCV" value={money(totals.weightedTcv)} /></div><Card title={`${partner} Partner Pipeline`}><PartnerTable rows={totals.rows} money={money} /></Card><Card title="Growth forecast · 10% annual"><div className="breakdown">{forecast.map((x) => <div key={x.year}><span>Year {x.year}</span><span></span><strong>{money(x.arr)}</strong></div>)}</div></Card></>; }
'''
          s, count = re.subn(r'function DatekDashboard\(\{ projects, money \}\) \{.*?\nfunction PartnerTable', dashboard + 'function PartnerTable', s, count=1, flags=re.S)
          if count != 1: raise SystemExit(f'DatekDashboard replacement count={count}')

          old_header = 'function PartnerReports({ projects, p, money }) { const [scope,setScope] = useState("portfolio");'
          new_header = 'function PartnerReports({ projects, p, money }) { const cmsPartnerKeys = [...new Set(projects.map((project) => { const product = (project.catalogue?.smart || []).find((item) => item.id === project.solution?.lcuProductId); return String(product?.brand || "").trim(); }).filter(Boolean))].sort(); const [scope,setScope] = useState("portfolio");'
          if old_header not in s: raise SystemExit('PartnerReports header not found')
          s = s.replace(old_header,new_header,1)
          old_cards = '[["VIMALUX","VIMALUX"],["DATEK","DATEK"],["Felicity / PowerAiD","FELICITY"]]'
          new_cards = '[["VIMALUX","VIMALUX"],...cmsPartnerKeys.map((key) => [key,key]),["Felicity / PowerAiD","FELICITY"]]'
          if old_cards not in s: raise SystemExit('Partner report cards list not found')
          s = s.replace(old_cards,new_cards,1)
          app.write_text(s)

          partners = Path('src/partners.js')
          p = partners.read_text()
          old = 'export function partnerProjectRows(projects = [], partner) {\n  return projects.map((project) => {'
          new = '''export function partnerProjectRows(projects = [], partner) {\n  const normalizedPartner = String(partner || "").trim().toLowerCase();\n  const isCmsPartner = !["vimalux", "felicity"].includes(normalizedPartner);\n  const sourceProjects = isCmsPartner\n    ? projects.filter((project) => {\n        if (!project.solution?.smartEnabled || !project.solution?.cmsEnabled) return false;\n        const selectedLcu = (project.catalogue?.smart || []).find((item) => item.id === project.solution?.lcuProductId);\n        return String(selectedLcu?.brand || "").trim().toLowerCase() === normalizedPartner;\n      })\n    : projects;\n  return sourceProjects.map((project) => {'''
          if old not in p: raise SystemExit('partnerProjectRows marker not found')
          p = p.replace(old,new,1)
          p = p.replace('    if (partner === "DATEK") {','    if (isCmsPartner) {',1)
          partners.write_text(p)
          PY
      - name: Test
        run: npm test -- --runInBand || npm test
      - name: Commit upgrade
        run: |
          git config user.name "VIMALUX Automation"
          git config user.email "99176508+Vimalux@users.noreply.github.com"
          git add src/App.jsx src/partners.js
          git diff --cached --quiet || git commit -m "Simplify customer economics and generalize CMS partner pipeline"
          git push origin HEAD:main