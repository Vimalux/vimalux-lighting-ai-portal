name: Contract report horizon patch
on:
  push:
    branches: [staging/cashflow-financing-blue-orders-20260913]
    paths:
      - .github/workflows/contract-report-horizon-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/cashflow-financing-blue-orders-20260913
      - name: Patch generic customer PDF rendering only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/report.js')
          s = p.read_text()
          imp = 'import { contractReportResult } from "./contractReportHorizon.js";\n'
          anchor = 'import { warrantyLabel } from "./warranty.js";\n'
          if imp not in s:
              if anchor not in s: raise SystemExit('report import anchor not found')
              s = s.replace(anchor, anchor + imp, 1)
          signature = 'export function generateCustomerPdf(project, result) {\n'
          injection = signature + '  result = contractReportResult(result);\n'
          if injection not in s:
              if signature not in s: raise SystemExit('generateCustomerPdf anchor not found')
              s = s.replace(signature, injection, 1)
          p.write_text(s)
          PY
      - name: Commit rendering-only patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "VIMALUX Safe Release"
          git config user.email "99176508+Vimalux@users.noreply.github.com"
          git add src/report.js
          git commit -m "SAFE STAGING: cap generic customer PDF to service contract"
          git push origin HEAD:staging/cashflow-financing-blue-orders-20260913
