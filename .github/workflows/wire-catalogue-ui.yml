name: Wire catalogue UI
on:
  push:
    branches: [catalogue-ui-wire]
    paths:
      - '.github/workflows/wire-catalogue-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalogue-ui-wire
      - name: Patch App catalogue view
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          imp = 'import CatalogueExtended from "./CatalogueExtended.jsx";\n'
          anchor = 'import AdditionalCostsCard from "./AdditionalCostsCard.jsx";\n'
          if imp not in s:
              if anchor not in s:
                  raise SystemExit('Import anchor not found')
              s = s.replace(anchor, anchor + imp, 1)
          old = '{!isAgent && view === "catalogue" && <Catalogue p={project} update={update} />}'
          new = '{!isAgent && view === "catalogue" && <CatalogueExtended p={project} update={update} />}'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Catalogue render anchor not found')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "VIMALUX Automation"
          git config user.email "99176508+Vimalux@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet || git commit -m "Wire extended product catalogue into Intelligence"
          git push origin HEAD:catalogue-ui-wire
