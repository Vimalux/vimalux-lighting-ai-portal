name: Project price number format
on:
  push:
    branches: [fix/project-price-number-format]
permissions:
  contents: write
jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-price-number-format
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Localize project-price placeholders
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = 'placeholder={String(x.cat)}'
          new = 'placeholder={formatInputNumber(x.cat,p.language)}'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 raw project-price placeholders, found {count}')
          p.write_text(s.replace(old, new))

          t = Path('test/projectPriceFormatting.test.js')
          t.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport fs from "node:fs";\n\ntest("project price placeholders use localized two-decimal formatting", () => {\n  const source = fs.readFileSync(new URL("../src/App.jsx", import.meta.url), "utf8");\n  assert.equal(source.includes("placeholder={String(x.cat)}"), false);\n  assert.equal((source.match(/placeholder=\\{formatInputNumber\\(x\\.cat,p\\.language\\)\\}/g) || []).length, 2);\n});\n''')
          PY
      - name: Verify isolated scope
        run: |
          git add src/App.jsx test/projectPriceFormatting.test.js
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --name-only | grep -q '^src/App.jsx$'
          git diff --cached --name-only | grep -q '^test/projectPriceFormatting.test.js$'
      - run: npm test
      - run: npm run build
      - name: Commit validated fix
        run: |
          git config user.name VIMALUX
          git config user.email 99176508+Vimalux@users.noreply.github.com
          git diff --cached --quiet || git commit -m "Format project price placeholders"
          git push origin HEAD:fix/project-price-number-format
