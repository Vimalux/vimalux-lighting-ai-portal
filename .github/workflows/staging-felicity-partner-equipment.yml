name: Staging Felicity partner equipment UI
on:
  push:
    branches:
      - staging/felicity-procurement-safe-release
    paths:
      - '.github/felicity-partner-equipment.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/felicity-procurement-safe-release
      - name: Patch Solution UI only on staging
        run: python scripts/patch_felicity_partner_equipment.py
      - name: Run full regression suite
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit staging UI after full test suite
        run: |
          git config user.name "VIMALUX Automation"
          git config user.email "99176508+Vimalux@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet || git commit -m "Add partner equipment selector to Solution"
          git push origin HEAD:staging/felicity-procurement-safe-release
