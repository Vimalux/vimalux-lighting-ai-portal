name: Unify additional costs navigation

on:
  push:
    branches:
      - fix/unify-additional-costs-navigation

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/unify-additional-costs-navigation
          fetch-depth: 0

      - name: Apply isolated navigation refactor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text()

          old_workflow = '''const workflow = [
            ["customer", "customer"],
            ["existing", "existing"],
            ["solution", "solution"],
            ["pricing", "pricing"],
            ["assumptions", "assumptions"],
            ["business", "business"],
            ["report", "report"],
          ];
          const agentWorkflow = [
            ...workflow.slice(0, 3),
            ["additionalCosts", "additionalCosts"],
            ["assumptions", "assumptions"],
            ...workflow.slice(5),
          ];'''
          new_workflow = '''const workflow = [
            ["customer", "customer"],
            ["existing", "existing"],
            ["solution", "solution"],
            ["additionalCosts", "additionalCosts"],
            ["pricing", "pricing"],
            ["assumptions", "assumptions"],
            ["business", "business"],
            ["report", "report"],
          ];
          const agentWorkflow = workflow.filter(([id]) => id !== "pricing");'''

          old_render = '''          {isAgent && view === "additionalCosts" && <AdditionalCostsCard p={project} update={update} mode="agent" />}
                    {!isAgent && view === "pricing" && <Pricing p={project} r={result} update={update} t={t} money={money} />}'''
          new_render = '''          {view === "additionalCosts" && <AdditionalCostsCard p={project} update={update} mode={isAgent ? "agent" : "admin"} />}
                    {!isAgent && view === "pricing" && <Pricing p={project} r={result} update={update} t={t} money={money} />}'''

          embedded = '<VatSettings p={p} r={r} update={update} /><AdditionalCostsCard p={p} update={update} /><Card className="dimming-card"'
          replacement = '<VatSettings p={p} r={r} update={update} /><Card className="dimming-card"'

          changed = False
          if old_workflow in text:
            text = text.replace(old_workflow, new_workflow, 1)
            changed = True
          elif new_workflow not in text:
            raise SystemExit('Expected workflow block not found; refusing to mutate App.jsx')

          if old_render in text:
            text = text.replace(old_render, new_render, 1)
            changed = True
          elif new_render not in text:
            raise SystemExit('Expected additional-cost render block not found; refusing to mutate App.jsx')

          if embedded in text:
            text = text.replace(embedded, replacement, 1)
            changed = True
          elif replacement not in text:
            raise SystemExit('Expected embedded AdditionalCostsCard in Assumptions not found; refusing to mutate App.jsx')

          if changed:
            path.write_text(text)
          PY

      - name: Commit isolated refactor before validation
        run: |
          if git diff --quiet; then
            echo "No App.jsx changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "refactor(intelligence): unify additional costs navigation"
          git push origin HEAD:fix/unify-additional-costs-navigation

      - name: Validate platform consistency and tests
        run: npm ci && npm test && npm run build
