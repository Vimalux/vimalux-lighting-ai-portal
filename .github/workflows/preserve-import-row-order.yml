name: Preserve import row order
on:
  push:
    branches: [fix/preserve-import-row-order]
permissions:
  contents: write
jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preserve-import-row-order
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preserve source order and add regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lightingImport.js')
          s = p.read_text()
          old = '  const groups = [...grouped.values()].sort((a, b) => (a.existingCategory || "").localeCompare(b.existingCategory || "") || a.technology.localeCompare(b.technology) || a.existingWattage - b.existingWattage);'
          new = '  // Preserve the first-occurrence order from the input sheet. Map insertion order is stable, so perimetri/zone remain aligned with the source document.\n  const groups = [...grouped.values()];'
          if s.count(old) != 1:
              raise SystemExit(f'Expected import sorting line exactly once, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          t = Path('test/lightingImport.test.js')
          ts = t.read_text()
          marker = 'test("v2.3 groups retain category, replacement strategy and operating hours", () => {'
          if marker not in ts:
              raise SystemExit('Could not find lighting import test insertion point')
          test_block = '''test("grouped import preserves perimetro and zone order from the source sheet", () => {\n  const headers = ["Localizzazione / gruppo *", "Categoria apparecchio *", "Wattaggio attuale (W) *", "Tecnologia attuale *", "N. apparecchi *", "Ore funzionamento annue *", "Modalità di sostituzione"];\n  const mapping = guessLightingMapping(headers);\n  const rows = [\n    ["P1 – Via Parrà", "Stradale", 70, "SAP", 4, 4200, "Sostituzione completa"],\n    ["P2 – Via dei Romani", "Arredo urbano", 70, "SAP", 3, 4200, "Sostituzione completa"],\n    ["P1 – Via Parrà", "Stradale", 150, "SAP", 12, 4200, "Sostituzione completa"],\n    ["P3 – Via Trieste", "Lanterna", 125, "SAP", 14, 4200, "Retrofit"],\n  ];\n  const result = buildImportedGroups(rows, mapping, [{ id: "led-1", wattage: 30, active: true }], "it");\n  assert.deepEqual(result.groups.map(group => group.name), [\n    "P1 – Via Parrà",\n    "P2 – Via dei Romani",\n    "P1 – Via Parrà",\n    "P3 – Via Trieste",\n  ]);\n});\n\n'''
          if 'grouped import preserves perimetro and zone order from the source sheet' in ts:
              raise SystemExit('Regression test already exists')
          t.write_text(ts.replace(marker, test_block + marker, 1))
          PY
      - name: Verify isolated scope
        run: |
          git diff --name-only
          test "$(git diff --name-only | grep -v '^\.github/workflows/preserve-import-row-order.yml$' | wc -l)" -eq 2
          git diff --name-only | grep -q '^src/lightingImport.js$'
          git diff --name-only | grep -q '^test/lightingImport.test.js$'
      - run: npm test
      - run: npm run build
      - name: Commit validated fix
        run: |
          git config user.name VIMALUX
          git config user.email 99176508+Vimalux@users.noreply.github.com
          git add src/lightingImport.js test/lightingImport.test.js
          git diff --cached --quiet || git commit -m "Preserve input-sheet zone order"
          git push origin HEAD:fix/preserve-import-row-order
