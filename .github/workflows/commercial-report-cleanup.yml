name: Commercial report cleanup
on:
  push:
    paths:
      - '.github/commercial-report-cleanup.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install dependencies
        run: npm ci
      - name: Patch report semantics and VAT presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Anchor not found: {label}')
              return text.replace(old, new, 1)

          # 1) CAPEX page: hide Hybrid wording when Hybrid quantity is zero.
          path = Path('src/capexProposalPage.js')
          s = path.read_text()
          old = '''  const standardQty = Math.max(0, detail.totalLuminaireQuantity - detail.hybridLuminaireQuantity);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(8.5);
  doc.setTextColor(...navy);
  doc.text(it
    ? `${number(detail.totalLuminaireQuantity, 0, lang)} apparecchi: ${number(standardQty, 0, lang)} LED standard + ${number(detail.hybridLuminaireQuantity, 0, lang)} Hybrid`
    : `${number(detail.totalLuminaireQuantity, 0, lang)} luminaires: ${number(standardQty, 0, lang)} standard LED + ${number(detail.hybridLuminaireQuantity, 0, lang)} Hybrid`, 14, 37);

  section(it ? "Apparecchi LED / Hybrid" : "LED / Hybrid luminaires", 48);
'''
          new = '''  const standardQty = Math.max(0, detail.totalLuminaireQuantity - detail.hybridLuminaireQuantity);
  const hasHybrid = detail.hybridLuminaireQuantity > 0;
  const luminaireSummary = it
    ? hasHybrid
      ? `${number(detail.totalLuminaireQuantity, 0, lang)} apparecchi: ${number(standardQty, 0, lang)} LED standard + ${number(detail.hybridLuminaireQuantity, 0, lang)} Hybrid`
      : `${number(detail.totalLuminaireQuantity, 0, lang)} apparecchi LED standard`
    : hasHybrid
      ? `${number(detail.totalLuminaireQuantity, 0, lang)} luminaires: ${number(standardQty, 0, lang)} standard LED + ${number(detail.hybridLuminaireQuantity, 0, lang)} Hybrid`
      : `${number(detail.totalLuminaireQuantity, 0, lang)} standard LED luminaires`;
  const luminaireSectionTitle = it
    ? (hasHybrid ? "Apparecchi LED / Hybrid" : "Apparecchi LED")
    : (hasHybrid ? "LED / Hybrid luminaires" : "LED luminaires");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(8.5);
  doc.setTextColor(...navy);
  doc.text(luminaireSummary, 14, 37);

  section(luminaireSectionTitle, 48);
'''
          s = replace_once(s, old, new, 'capex hybrid heading')
          path.write_text(s)

          # 2) Preliminary proposal: deal-type specific CAPEX/payment wording and non-indexed TCV wording.
          path = Path('src/preliminaryProposalV2.js')
          s = path.read_text()
          anchor = '  const capexBreakdown = buildCustomerCapexRows(project, Number(result.capex) || 0, lang, result.additionalCapexSales);\n'
          insert = '''  const capexBreakdown = buildCustomerCapexRows(project, Number(result.capex) || 0, lang, result.additionalCapexSales);
  const dealType = String(calculated.dealType || project.assumptions?.dealType || "cash").toLowerCase();
  const isLaaS = dealType === "noleggio_operativo";
  const isFinance = dealType === "finance";
  const isFinanced = isLaaS || isFinance;
  const upfrontCustomerInvestment = isFinanced ? Math.max(0, Number(project.assumptions?.upfrontPayment) || 0) : Math.max(0, Number(result.capex) || 0);
  const projectCapexLabel = isFinanced
    ? (it ? "CAPEX progetto / investimento finanziato" : "Project CAPEX / financed investment")
    : (it ? "Investimento iniziale" : "Initial investment");
  const annualPaymentLabel = isLaaS
    ? (it ? "Canone annuale LaaS / Noleggio tutto incluso" : "Annual all-inclusive LaaS / lease payment")
    : isFinance
      ? (it ? "Pagamento annuale totale cliente" : "Total annual customer payment")
      : (it ? "OPEX annuale Smart / CMS" : "Annual Smart / CMS OPEX");
  const monthlyCustomerPayment = Math.max(0, Number(calculated.monthlyPayment) || annualFee / 12);
  const monthlyFinancingPayment = Math.max(0, Number(calculated.financingMonthlyPayment) || 0);
  const monthlyServiceOpex = Math.max(0, Number(calculated.totalAnnualOpex) || 0) / 12;
'''
          s = replace_once(s, anchor, insert, 'preliminary commercial helper')

          s = replace_once(
              s,
              '    head: [[it ? "Investimento iniziale" : "Initial investment", it ? "Canone annuale Smart / CMS" : "Annual Smart / CMS fee", it ? `TCV ${contractYears} anni` : `TCV ${contractYears} years`]],\n',
              '    head: [[projectCapexLabel, annualPaymentLabel, it ? `TCV ${contractYears} anni` : `TCV ${contractYears} years`]],\n',
              'proposal top headings',
          )

          old_note = '''  doc.text(it
    ? `TCV include l'indicizzazione del canone/OPEX del ${number(escalation, 1, lang)}% annuo, ove applicabile.`
    : `TCV includes ${number(escalation, 1, lang)}% annual service/OPEX escalation where applicable.`, 14, doc.lastAutoTable.finalY + 4.5);
'''
          new_note = '''  doc.text(it
    ? (isLaaS
      ? "TCV = somma dei canoni contrattuali previsti nel periodo."
      : "TCV = somma dei pagamenti contrattuali previsti nel periodo.")
    : (isLaaS
      ? "TCV = sum of the contractual LaaS / lease payments over the term."
      : "TCV = sum of contractual customer payments over the term."), 14, doc.lastAutoTable.finalY + 4.5);
'''
          s = replace_once(s, old_note, new_note, 'TCV note')

          s = replace_once(
              s,
              'head: [[customerText(it ? "Beneficio netto annuo Comune" : "Municipality annual net benefit"), it ? "Riduzione energia" : "Energy reduction", it ? "Riduzione CO2" : "CO2 reduction", "Payback", customerText(it ? `VAN beneficio Comune (${Math.round(Number(project.assumptions?.analysisPeriod) || 0)} anni)` : `Municipality-benefit NPV (${Math.round(Number(project.assumptions?.analysisPeriod) || 0)} years)`) ]],',
              'head: [[customerText(it ? "Beneficio netto annuo Comune" : "Municipality annual net benefit"), it ? "Riduzione energia" : "Energy reduction", it ? "Riduzione CO2" : "CO2 reduction", isFinanced ? (it ? "Payback operativo (escl. finanziamento)" : "Operational payback (excl. financing)") : "Payback", customerText(it ? `VAN beneficio Comune (${Math.round(Number(project.assumptions?.analysisPeriod) || 0)} anni)` : `Municipality-benefit NPV (${Math.round(Number(project.assumptions?.analysisPeriod) || 0)} years)`) ]],',
              'proposal payback label',
          )

          old_commercial = '''      [it ? "Investimento iniziale (CAPEX)" : "Initial investment (CAPEX)", money(result.capex, lang)],
      [it ? "Canone annuale Smart Lighting / CMS" : "Annual Smart Lighting / CMS fee", money(annualFee, lang)],
'''
          new_commercial = '''      [projectCapexLabel, money(result.capex, lang)],
      ...(isFinanced ? [[it ? "Investimento iniziale cliente" : "Customer upfront investment", money(upfrontCustomerInvestment, lang)]] : []),
      [annualPaymentLabel, money(annualFee, lang)],
      ...(isLaaS ? [
        [it ? "Canone mensile LaaS / Noleggio tutto incluso" : "Monthly all-inclusive LaaS / lease payment", money(monthlyCustomerPayment, lang)],
        [it ? "OPEX servizi / mese (incluso nel canone)" : "Service OPEX / month (included in payment)", money(monthlyServiceOpex, lang)],
      ] : isFinance ? [
        [it ? "Rata mensile finanziamento CAPEX" : "Monthly CAPEX financing payment", money(monthlyFinancingPayment, lang)],
        [it ? "OPEX servizi / mese" : "Service OPEX / month", money(monthlyServiceOpex, lang)],
        [it ? "Pagamento mensile totale cliente" : "Total monthly customer payment", money(monthlyCustomerPayment, lang)],
      ] : []),
'''
          s = replace_once(s, old_commercial, new_commercial, 'commercial structure payments')
          s = replace_once(
              s,
              '      [it ? `TCV ${contractYears} anni, indicizzato` : `Indexed TCV ${contractYears} years`, money(result.tcv, lang)],\n',
              '      [it ? `TCV ${contractYears} anni` : `TCV ${contractYears} years`, money(result.tcv, lang)],\n',
              'TCV indexed label',
          )
          s = replace_once(
              s,
              '      [it ? "Canone Smart Lighting / CMS" : "Smart Lighting / CMS fee", `(${money(annualFee, lang)})`],\n',
              '      [annualPaymentLabel, `(${money(annualFee, lang)})`],\n',
              'annual benefit payment label',
          )
          s = replace_once(
              s,
              '      [it ? "Indicizzazione canone/OPEX" : "Service/OPEX escalation", `${number(escalation, 1, lang)}% ${it ? "annuo" : "p.a."}`],\n',
              '      [isLaaS ? (it ? "Indicizzazione OPEX servizi" : "Service OPEX escalation") : (it ? "Indicizzazione canone/OPEX" : "Service/OPEX escalation"), `${number(escalation, 1, lang)}% ${it ? "annuo" : "p.a."}`],\n',
              'assumption escalation label',
          )
          path.write_text(s)

          # 3) Cost evolution page: funded CAPEX is not customer upfront investment.
          path = Path('src/proposalCostEvolutionPage.js')
          s = path.read_text()
          s = replace_once(
              s,
              '      [it ? "Investimento iniziale" : "Initial investment", reportMoney(calculated.totalCapex, lang)],\n',
              '      [calculated.dealType === "cash" ? (it ? "Investimento iniziale" : "Initial investment") : (it ? "CAPEX progetto / investimento finanziato" : "Project CAPEX / financed investment"), reportMoney(calculated.totalCapex, lang)],\n',
              'cost evolution capex label',
          )
          path.write_text(s)

          # 4) Cash-flow page: LaaS labels and included OPEX wording.
          path = Path('src/proposalFinalVisualPages.js')
          s = path.read_text()
          s = replace_once(
              s,
              '  const isCashDeal = String(calculated.dealType || "").toLowerCase() === "cash";\n',
              '  const normalizedDealType = String(calculated.dealType || "").toLowerCase();\n  const isCashDeal = normalizedDealType === "cash";\n  const isLaaS = normalizedDealType === "noleggio_operativo";\n  const isFinance = normalizedDealType === "finance";\n',
              'cashflow deal type flags',
          )
          s = replace_once(
              s,
              '      it ? "Servizi/OPEX" : "Service/OPEX",\n      it ? "Invest./finanz." : "Invest./finance",\n',
              '      isLaaS ? (it ? "OPEX servizi (incluso)" : "Service OPEX (included)") : (it ? "Servizi/OPEX" : "Service/OPEX"),\n      isLaaS ? (it ? "Canone LaaS / Noleggio" : "LaaS / lease payment") : isFinance ? (it ? "Rata CAPEX / finanz." : "CAPEX / finance payment") : (it ? "Investimento" : "Investment"),\n',
              'cashflow headers',
          )
          s = replace_once(
              s,
              '      reportMoney(row.serviceOpex, lang),\n      reportMoney(row.payment, lang),\n',
              '      isLaaS && Number(row.year) > 0 && safe(row.payment) > 0 ? (it ? "Incluso" : "Included") : reportMoney(row.serviceOpex, lang),\n      reportMoney(row.payment, lang),\n',
              'cashflow included OPEX',
          )
          path.write_text(s)

          # 5) Dashboard VAT card: deal-type aware, avoid gross CAPEX/payback for LaaS.
          path = Path('src/VatSettings.jsx')
          s = path.read_text()
          start = s.index('export function VatSummaryCard({ p, r }) {')
          s = s[:start] + '''export function VatSummaryCard({ p, r }) {
  const it = p.language === "it";
  const summary = calculateVatSummary(p, r);
  const subject = customerVatSubject(p, p.language);
  const money = (value) => formatMoney(value, p.language, p.project.currency);
  const dealType = String(r.dealType || p.assumptions?.dealType || "cash").toLowerCase();
  const unrecoverableShare = 1 - Number(summary.recoverablePercent || 0) / 100;
  const financingMonthly = Math.max(0, Number(r.financingMonthlyPayment) || 0);
  const serviceMonthly = Math.max(0, Number(r.totalAnnualOpex ?? r.annualOpex) || 0) / 12;
  const totalMonthlyNet = Math.max(0, Number(r.monthlyPayment) || financingMonthly + serviceMonthly);
  const financingVatMonthly = financingMonthly * Number(summary.hardwareRate || 0) / 100 * unrecoverableShare;
  const serviceVatMonthly = serviceMonthly * Number(summary.digitalRate || 0) / 100 * unrecoverableShare;
  const unrecoverableMonthlyVat = financingVatMonthly + serviceVatMonthly;
  const totalMonthlyGross = totalMonthlyNet + unrecoverableMonthlyVat;

  if (dealType === "noleggio_operativo") {
    return <section className="card">
      <h2>{it ? `Impatto IVA per il ${subject}` : `${subject} VAT impact`}</h2>
      <div className="kpis">
        <div className="kpi"><span>{it ? "Canone mensile netto" : "Net monthly payment"}</span><strong>{money(totalMonthlyNet)}</strong></div>
        <div className="kpi"><span>{it ? "IVA mensile non recuperabile" : "Unrecoverable monthly VAT"}</span><strong>{money(unrecoverableMonthlyVat)}</strong></div>
        <div className="kpi"><span>{it ? "Canone mensile lordo cliente" : "Gross monthly customer payment"}</span><strong>{money(totalMonthlyGross)}</strong></div>
        <div className="kpi"><span>{it ? "CAPEX progetto / investimento finanziato" : "Project CAPEX / financed investment"}</span><strong>{money(summary.capexNet)}</strong></div>
        <div className="kpi"><span>{it ? `VAN ${subject}` : `${subject} NPV`}</span><strong>{money(summary.municipalityNpv)}</strong></div>
      </div>
    </section>;
  }

  if (dealType === "finance") {
    return <section className="card">
      <h2>{it ? `Impatto IVA per il ${subject}` : `${subject} VAT impact`}</h2>
      <div className="kpis">
        <div className="kpi"><span>{it ? "Rata mensile finanziamento CAPEX" : "Monthly CAPEX financing payment"}</span><strong>{money(financingMonthly)}</strong></div>
        <div className="kpi"><span>{it ? "OPEX servizi / mese" : "Service OPEX / month"}</span><strong>{money(serviceMonthly)}</strong></div>
        <div className="kpi"><span>{it ? "Pagamento mensile netto totale" : "Total net monthly payment"}</span><strong>{money(totalMonthlyNet)}</strong></div>
        <div className="kpi"><span>{it ? "IVA mensile non recuperabile" : "Unrecoverable monthly VAT"}</span><strong>{money(unrecoverableMonthlyVat)}</strong></div>
        <div className="kpi"><span>{it ? "Pagamento mensile lordo totale" : "Total gross monthly payment"}</span><strong>{money(totalMonthlyGross)}</strong></div>
        <div className="kpi"><span>{it ? `VAN ${subject}` : `${subject} NPV`}</span><strong>{money(summary.municipalityNpv)}</strong></div>
      </div>
    </section>;
  }

  const payback = summary.municipalityPayback == null ? "-" : `${formatNumber(summary.municipalityPayback, p.language, 1)} ${it ? "anni" : "years"}`;
  return <section className="card">
    <h2>{it ? `Impatto IVA per il ${subject}` : `${subject} VAT impact`}</h2>
    <div className="kpis">
      <div className="kpi"><span>{it ? "CAPEX netto" : "Net CAPEX"}</span><strong>{money(summary.capexNet)}</strong></div>
      <div className="kpi"><span>{it ? "IVA non recuperabile" : "Unrecoverable VAT"}</span><strong>{money(summary.unrecoverableCapexVat)}</strong></div>
      <div className="kpi"><span>{it ? `CAPEX lordo ${subject}` : `${subject} gross CAPEX`}</span><strong>{money(summary.municipalityCapexCash)}</strong></div>
      <div className="kpi"><span>{it ? `Payback ${subject}` : `${subject} payback`}</span><strong>{payback}</strong></div>
      <div className="kpi"><span>{it ? `VAN ${subject}` : `${subject} NPV`}</span><strong>{money(summary.municipalityNpv)}</strong></div>
    </div>
  </section>;
}
'''
          path.write_text(s)

          # Regression checks for agreed semantics.
          test = Path('test/commercialReportSemantics.test.js')
          test.write_text('''import test from "node:test";
import assert from "node:assert/strict";
import fs from "node:fs";

const proposal = fs.readFileSync(new URL("../src/preliminaryProposalV2.js", import.meta.url), "utf8");
const capexPage = fs.readFileSync(new URL("../src/capexProposalPage.js", import.meta.url), "utf8");
const cashPage = fs.readFileSync(new URL("../src/proposalFinalVisualPages.js", import.meta.url), "utf8");
const vatCard = fs.readFileSync(new URL("../src/VatSettings.jsx", import.meta.url), "utf8");

test("LaaS proposal uses all-inclusive payment semantics and non-indexed TCV wording", () => {
  assert.match(proposal, /Canone annuale LaaS \/ Noleggio tutto incluso/);
  assert.match(proposal, /Canone mensile LaaS \/ Noleggio tutto incluso/);
  assert.match(proposal, /OPEX servizi \/ mese \(incluso nel canone\)/);
  assert.doesNotMatch(proposal, /TCV \$\{contractYears\} anni, indicizzato/);
});

test("zero-Hybrid CAPEX page switches to LED-only wording", () => {
  assert.match(capexPage, /hasHybrid \? "Apparecchi LED \/ Hybrid" : "Apparecchi LED"/);
  assert.match(capexPage, /apparecchi LED standard/);
});

test("LaaS cash-flow labels canone and included OPEX explicitly", () => {
  assert.match(cashPage, /Canone LaaS \/ Noleggio/);
  assert.match(cashPage, /OPEX servizi \(incluso\)/);
});

test("VAT card is deal-type aware", () => {
  assert.match(vatCard, /dealType === "noleggio_operativo"/);
  assert.match(vatCard, /Canone mensile lordo cliente/);
  assert.match(vatCard, /Rata mensile finanziamento CAPEX/);
});
''')
          PY
          npm test
          npm run build
      - name: Commit report cleanup
        run: |
          git config user.name "VIMALUX Automation"
          git config user.email "99176508+Vimalux@users.noreply.github.com"
          git add src/capexProposalPage.js src/preliminaryProposalV2.js src/proposalCostEvolutionPage.js src/proposalFinalVisualPages.js src/VatSettings.jsx test/commercialReportSemantics.test.js
          git diff --cached --quiet || git commit -m "Align LaaS report labels and customer payment semantics"
          git push origin HEAD:main
