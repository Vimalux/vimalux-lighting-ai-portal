name: Clarify CAPEX and TCV labels
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clarify-capex-tcv-labels.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Clarify customer-facing CAPEX and TCV labels
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  if new in s:
                      return
                  raise SystemExit(f'Anchor not found in {path}: {old[:120]}')
              p.write_text(s.replace(old, new, count))

          # Preliminary Proposal: make upfront investment, annual services and total contract value unambiguous.
          replace(
              'src/preliminaryProposal.js',
              'head: [["CAPEX", it ? "OPEX annuo" : "Annual OPEX", it ? "Ricavo annuo contratto" : "Annual Contract Revenue", "TCV"]],',
              'head: [[it ? "Investimento iniziale (CAPEX)" : "Initial investment (CAPEX)", it ? "Servizi annuali / OPEX" : "Annual services / OPEX", it ? "Ricavo annuo contratto" : "Annual Contract Revenue", it ? `TCV - valore totale ${Math.round(Number(result.contractYears) || 0)} anni` : `TCV - total value ${Math.round(Number(result.contractYears) || 0)} years`]],'
          )
          replace(
              'src/preliminaryProposal.js',
              '["CAPEX", money(result.capex, lang)],\n      [it ? "OPEX annuo" : "Annual OPEX", money(result.annualOpex, lang)],',
              '[it ? "Investimento iniziale (CAPEX)" : "Initial investment (CAPEX)", money(result.capex, lang)],\n      [it ? "Servizi annuali / OPEX" : "Annual services / OPEX", money(result.annualOpex, lang)],'
          )
          replace(
              'src/preliminaryProposal.js',
              '["TCV", money(result.tcv, lang)],',
              '[it ? `TCV - valore contrattuale totale ${Math.round(Number(result.contractYears) || 0)} anni` : `TCV - total contract value ${Math.round(Number(result.contractYears) || 0)} years`, money(result.tcv, lang)],'
          )

          # Business Case PDF: clarify CAPEX as the upfront investment in the executive summary.
          replace(
              'src/report.js',
              'head: [[t("preliminary"), t("capex"), paymentLabel, it ? "OPEX mensile" : "Monthly OPEX", `${t("annualNet")}*`, t("roi"), paybackLabel]],',
              'head: [[t("preliminary"), it ? "Investimento iniziale (CAPEX)" : "Initial investment (CAPEX)", paymentLabel, it ? "OPEX mensile" : "Monthly OPEX", `${t("annualNet")}*`, t("roi"), paybackLabel]],'
          )
          PY
      - name: Commit label clarification
        run: |
          git config user.name "VIMALUX Automation"
          git config user.email "99176508+Vimalux@users.noreply.github.com"
          git add src/preliminaryProposal.js src/report.js
          git diff --cached --quiet || git commit -m "Clarify CAPEX and TCV in customer reports"
          git push origin HEAD:main
