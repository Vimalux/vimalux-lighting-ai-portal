name: Staging partner selector fix
on:
  push:
    branches:
      - staging/felicity-procurement-safe-release
    paths:
      - '.github/staging-partner-selector-fix.trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/felicity-procurement-safe-release
      - name: Apply partner selector fix
        run: node scripts/fix-partner-equipment-selector.cjs
      - name: Run regression suite
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit staging selector fix
        run: |
          git config user.name "VIMALUX Automation"
          git config user.email "99176508+Vimalux@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet || git commit -m "Fix partner equipment product selection UX"
          git push origin HEAD:staging/felicity-procurement-safe-release
