name: Final report terminology
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align preliminary proposal terminology
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/preliminaryProposal.js')
          s = p.read_text()
          s = s.replace('it ? "Ricavo annuo contratto" : "Annual Contract Revenue"', 'it ? "Ricavo contrattuale annuo" : "Annual Contract Revenue"')
          s = s.replace('it ? `TCV - valore totale ${Math.round(Number(result.contractYears) || 0)} anni` : `TCV - total value ${Math.round(Number(result.contractYears) || 0)} years`', 'it ? `TCV – valore contrattuale totale ${Math.round(Number(result.contractYears) || 0)} anni` : `TCV – total contract value ${Math.round(Number(result.contractYears) || 0)} years`')
          s = s.replace('it ? `TCV - valore contrattuale totale ${Math.round(Number(result.contractYears) || 0)} anni` : `TCV - total contract value ${Math.round(Number(result.contractYears) || 0)} years`', 'it ? `TCV – valore contrattuale totale ${Math.round(Number(result.contractYears) || 0)} anni` : `TCV – total contract value ${Math.round(Number(result.contractYears) || 0)} years`')
          p.write_text(s)
          PY
      - name: Test
        run: npm test -- --run || npm test
      - name: Commit
        run: |
          git config user.name "VIMALUX Automation"
          git config user.email "99176508+Vimalux@users.noreply.github.com"
          git add src/preliminaryProposal.js
          git diff --cached --quiet || git commit -m "Align preliminary proposal commercial terminology"
          git push origin HEAD:main
